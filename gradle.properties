# 沙箱内存紧张，限制单次构建占用，避免与并行任务抢内存导致 OOM
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
# 工作区挂在 NAS 上，构建缓存的增量产物经常与磁盘状态不一致
# （出现过 Hilt 聚合依赖读不到 class element、javac 目录删不掉的情况），关掉更稳。
org.gradle.caching=false
org.gradle.workers.max=2
org.gradle.configureondemand=false

# Kotlin 编译放进 Gradle 进程内，不再单独起 Kotlin daemon
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
